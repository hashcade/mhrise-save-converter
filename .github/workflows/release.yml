name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      tag:
        description: Release tag to build and publish
        required: true
        type: string

env:
  CARGO_TERM_COLOR: always
  RELEASE_TAG: ${{ inputs.tag || github.ref_name }}

jobs:
  validate:
    name: Validate release version
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4

      - name: Match tag and package versions
        shell: bash
        run: |
          tag_version="${RELEASE_TAG#v}"
          package_version="$(sed -nE 's/^version = "([^"]+)"/\1/p' Cargo.toml | head -n 1)"
          test -n "$tag_version"
          test "$tag_version" = "$package_version"

  package:
    name: Package ${{ matrix.target }}
    needs: validate
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
          - os: macos-15
            target: aarch64-apple-darwin
          - os: macos-15-intel
            target: x86_64-apple-darwin
          - os: windows-latest
            target: x86_64-pc-windows-msvc
    runs-on: ${{ matrix.os }}
    permissions:
      contents: read
    steps:
      - name: Install GUI build dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install --yes build-essential clang cmake pkg-config libfontconfig-dev libwayland-dev libwebkit2gtk-4.1-dev libxkbcommon-x11-dev libx11-xcb-dev libssl-dev libzstd-dev libvulkan1

      - uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: "1.99.0"
          target: ${{ matrix.target }}

      - name: Cache Rust dependencies
        uses: Swatinem/rust-cache@v2
        with:
          key: release-${{ matrix.target }}

      - name: Build release binaries
        run: cargo build --locked --release --target ${{ matrix.target }} --bins

      - name: Package release artifact
        run: python scripts/package.py --target-dir target/${{ matrix.target }}/release --target ${{ matrix.target }} --output dist

      - name: Upload release artifact
        uses: actions/upload-artifact@v4
        with:
          name: mhrise-save-converter-${{ matrix.target }}
          path: dist/*
          if-no-files-found: error

  publish:
    name: Publish GitHub Release
    needs: package
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ inputs.tag || github.ref_name }}

      - name: Download packaged artifacts
        uses: actions/download-artifact@v4
        with:
          pattern: mhrise-save-converter-*
          path: dist
          merge-multiple: true

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: lts/*

      - name: Verify checksums
        shell: bash
        run: |
          for checksum in dist/*.sha256; do
            (cd dist && sha256sum -c "$(basename "$checksum")")
          done

      - name: Generate release notes
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: npx changelogithub --github "$GITHUB_REPOSITORY"

      - name: Upload release files
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release upload "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" dist/* --clobber

      - name: Verify downloadable release assets
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir release-download
          gh release download "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" --dir release-download
          for checksum in dist/*.sha256; do
            archive_name="$(basename "$checksum" .sha256)"
            expected_sha="$(awk '{print $1}' "$checksum")"
            actual_sha="$(sha256sum "release-download/$archive_name" | awk '{print $1}')"
            test "$actual_sha" = "$expected_sha"
          done
