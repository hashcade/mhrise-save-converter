[package]
name = "mhrise-save-converter"
version = "0.1.3"
edition = "2024"
rust-version = "1.88"
description = "A CLI for inspecting and converting Monster Hunter Rise save containers."
license = "MIT"
readme = "README.md"
repository = "https://github.com/jinghaihan/mhrise-save-converter"
keywords = ["monster-hunter-rise", "save-editor", "steam", "nintendo-switch"]
categories = ["command-line-utilities"]

[dependencies]
anyhow = "1.0"
aes = "0.9"
bitflags = "2.9"
cbc = "0.2"
clap = { version = "4.5", features = ["derive"] }
flate2 = { version = "1.1", default-features = false, features = ["rust_backend"] }
eframe = { version = "0.33", default-features = false, features = ["default_fonts", "glow", "wayland", "x11"] }
hex-literal = "1.0"
murmur3 = "0.5"
num-bigint = { version = "0.4", features = ["serde"] }
num-integer = "0.1"
num-traits = "0.2"
rand = "0.10"
rfd = "0.15"
sha3 = "0.11"
thiserror = "2.0"

[dev-dependencies]
assert_cmd = "2.0"

[profile.release]
lto = "thin"
codegen-units = 1
strip = "symbols"

[lints.rust]
unsafe_code = "forbid"

[lints.clippy]
all = "warn"
